<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-commerce</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/carrossel.css">
    <link rel="stylesheet" href="css/categorias.css">
    <link rel="stylesheet" href="css/produtos.css">

    <!-- Favicon será adicionado aqui futuramente -->
</head>

<body>
    <!--Cabeçalho-->
    <header>
        <div class="header">
            <!-- Logo -->
            <div class="logo">
                New <span>e-Commerce</span>
            </div>

            <!-- Barra de busca -->
            <div class="search">
                <input type="text" id="searchInput" placeholder="O que você está procurando?">
                <button id="btnSearch" onclick="searchProducts()">⌕</button>
            </div>

            <!-- Ações (Perfil, Favoritos, Carrinho) -->
            <div class="header-actions">
                <!-- Perfil -->
                <button class="icon-btn" id="btnAccount" onclick="openAccount()" title="My account">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-person" viewBox="0 0 16 16">
                        <path
                            d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                    </svg>
                </button>

                <!-- Favoritos -->
                <button class="icon-btn" id="btnFavorites" onclick="openFavorites()" title="Favorite">♡</button>

                <!-- Carrinho -->
                <button class="icon-btn" id="btnCart" onclick="openCart()" title="Cart">
                    🛒 <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>

        <!-- Navegação -->
        <nav class="primary">
            <ul id="Menu">
                <li><a href="#">Home</a></li>
                <li><a href="#celulares">Celulares</a></li>
                <li><a href="#notebooks">Notebooks</a></li>
                <li><a href="#games">Games</a></li>
                <li><a href="#audio">Áudio</a></li>
                <li><a href="#ofertas">Ofertas</a></li>
                <li><a href="#suporte">Suporte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Carrossel de imagens -->
        <section id="carousel">
            <!-- Slide 1 -->
            <article class="slide ativo">
                <a href="#" class="slide-link">
                    <img src="img/carrosel/banner_exclusivo.png" alt="Banner Exclusivo">
                </a>
            </article>

            <!-- Slide 2 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrosel/Caixa_de_som.png" alt="Caixa de som">
                </a>
            </article>

            <!-- Slide 3 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrosel/Fone_Bluetooth.png" alt="Fone Bluetooth">
                </a>
            </article>

            <!-- Slide 4 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrosel/Smartwatch.png" alt="Smartwatch">
                </a>
            </article>

            <!-- Slide 5 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrosel/Teclado_mecânico.png" alt="Teclado Mecânico">
                </a>
            </article>

            <!-- Slide 6 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrosel/ps5.png" alt="PlayStation 5">
                </a>
            </article>

            <!-- Botões de navegação lateral -->
            <button id="btn-before">&#8592;</button>
            <button id="btn-after">&#8594;</button>
        </section>
    
        <!-- Categoria de produtos -->

        <section class="section">
            <div class="section-header">
                <h2>Categorias</h2>
                <a href="#">Ver todas</a>
            </div>
            <div class="categories">
                <div class="category">
                    <div class="category-icon">💻</div>
                    <span>Notebooks</span>
                </div>
                <div class="category">
                    <div class="category-icon">📱</div>
                    <span>Celulares</span>
                </div>
                <div class="category">
                    <div class="category-icon">🎧</div>
                    <span>Fones de Ouvido</span>
                </div>
                <div class="category">
                    <div class="category-icon">⌚</div>
                    <span>Smartwatches</span>
                </div>
                <div class="category">
                    <div class="category-icon">🎮</div>
                    <span>Games</span>
                </div>
                <div class="category">
                    <div class="category-icon">📸</div>
                    <span>Câmeras</span>
                </div>
            </div>

        <!-- Seção de produtos em destaque -->
        <section class="section" id="productsSection">
            <div class="section-header">
                <div>
                    <h2>Produtos em destaque</h2>
                </div>
                <a href="#">Ver todos →</a>
            </div>

            <div class="products" id="products">
                <div class="products" data-name="Iphone 13 Pro Max">
                    <div class="products-image">
                        <!-- Imagem do iPhone corrigida para a raiz -->
                        <img src="img/iphone-13-max/iphone-13-pro-max-1920x700.png" alt="iPhone 13 Pro Max">
                        <span class="discount">-20%</span>
                        <button class="favorite-btn">🤍</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <!-- Rodapé da página -->
    </footer>

    <!-- Script JS para o carrossel -->
    <script src="js/carrossel.js"></script>
</body>

</html>
