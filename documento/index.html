<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new e-Commerce</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/carrossel.css">
    <link rel="stylesheet" href="css/categorias.css">
    <link rel="stylesheet" href="css/produtos.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/pagina-produtos.css">

    <!-- Favicon será adicionado aqui futuramente -->
    <link rel="icon" href="img/logo_new_e-commerce/favicon_e-commerce.png" type="image/x-icon">

</head>

<body>
    <!--Cabeçalho-->
    <header>
        <div class="header">
            <!-- Logo -->
            <div class="logo">
                New <span>e-Commerce</span>
            </div>

            <!-- Barra de busca -->
            <div class="search">
                <input type="text" id="searchInput" placeholder="O que você está procurando?">
                <button id="btnSearch" onclick="searchProducts()">⌕</button>
            </div>

            <!-- Ações (Perfil, Favoritos, Carrinho) -->
            <div class="header-actions">
                <!-- Perfil -->
                <button class="icon-btn" id="btnAccount" onclick="openAccount()" title="My account">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-person" viewBox="0 0 16 16">
                        <path
                            d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                    </svg>
                    <span class="tooltip">Minha conta</span>
                </button>

                <!-- Favoritos -->
                <button class="icon-btn" id="btnFavorites" onclick="openFavorites()" title="Favorite">♡
                    <span class="tooltip">Favoritos</span>
                </button>

                <!-- Carrinho -->
                <a href="cart.html" style="text-decoration: none;">
                    <button class="icon-btn" id="btnCart" title="Cart">
                        🛒 <span class="cart-count" id="cartCount">0</span>
                            <span class="tooltip">Carrinho de compras</span>
                    </button>
                </a>

                <!-- Tema -->
                <input type="checkbox" id="tema-toggle">

                <label for="tema-toggle" class="theme-btn">
                    <span class="sol">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-sun" viewBox="0 0 16 16">
                            <path
                                d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708" />
                        </svg>
                    </span>
                    <span class="lua">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-moon-fill" viewBox="0 0 16 16">
                            <path
                                d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278" />
                        </svg>
                    </span>
                </label>
            </div>
        </div>

        <!-- Navegação -->
        <nav class="primary">
            <ul id="Menu">
                <li><a href="#">Home</a></li>
                <li><a href="#celulares">Celulares</a></li>
                <li><a href="#notebooks">Notebooks</a></li>
                <li><a href="#games">Games</a></li>
                <li><a href="#audio">Áudio</a></li>
                <li><a href="#ofertas">Ofertas</a></li>
                <li><a href="#suporte">Suporte</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Carrossel de imagens -->
        <section id="carousel">
            <!-- Slide 1 -->
            <article class="slide ativo">
                <a href="#" class="slide-link">
                    <img src="img/carrossel/Banner Exclusivo.png" alt="Banner Exclusivo">
                </a>
            </article>

            <!-- Slide 2 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrossel/Caixa de som.png" alt="Caixa de som">
                </a>
            </article>

            <!-- Slide 3 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrossel/Fone  Bluetooth.png" alt="Fone Bluetooth">
                </a>
            </article>

            <!-- Slide 4 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrossel/Smartwatch.png" alt="Smartwatch">
                </a>
            </article>

            <!-- Slide 5 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrossel/Teclado-Mecânico.png" alt="Teclado Mecânico">
                </a>
            </article>

            <!-- Slide 6 -->
            <article class="slide">
                <a href="#" class="slide-link">
                    <img src="img/carrossel/ps5.png" alt="PlayStation 5">
                </a>
            </article>

            <!-- Botões de navegação lateral -->
            <button id="btn-before">&#8592;</button>
            <button id="btn-after">&#8594;</button>
        </section>

        <!-- Categoria de produtos -->

        <section class="section">
            <div class="section-header">
                <h2>Categorias</h2>
                <a href="#">Ver todas</a>
            </div>
            <div class="categories">
                <div class="category">
                    <div class="category-icon">💻</div>
                    <span>Notebooks</span>
                </div>
                <div class="category">
                    <div class="category-icon">📱</div>
                    <span>Celulares</span>
                </div>
                <div class="category">
                    <div class="category-icon">🎧</div>
                    <span>Fones de Ouvido</span>
                </div>
                <div class="category">
                    <div class="category-icon">⌚</div>
                    <span>Smartwatches</span>
                </div>
                <div class="category">
                    <div class="category-icon">🎮</div>
                    <span>Games</span>
                </div>
                <div class="category">
                    <div class="category-icon">📸</div>
                    <span>Câmeras</span>
                </div>
            </div>

            <!-- Seção de produtos em destaque -->
            <section class="section" id="productsSection">
                <div class="section-header">
                    <div>
                        <h2>Produtos em destaque</h2>
                    </div>
                    <a href="#">Ver todos →</a>
                </div>

                <div class="products" id="products">
                    <div class="products" data-name="Iphone 13 Pro Max">
                        <div class="products-image">
                            <img src="img/produtos/celulares/iphone 13 pro max.png" alt="iPhone 13 Pro Max">
                            <span class="discount">-20%</span>
                            <button class="favorite-btn">🤍</button>
                        </div>
                    </div>
                </div>

                 <div class="products" id="products">
                    <div class="products" data-name="?">
                        <div class="products-image">
                            <img src="img/" alt="?">
                            <span class="discount">-20%</span>
                            <button class="favorite-btn">🤍</button>
                        </div>
                    </div>
                </div>

                 <div class="products" id="products">
                    <div class="products" data-name="?">
                        <div class="products-image">
                            <img src="img/" alt="?">
                            <span class="discount">-20%</span>
                            <button class="favorite-btn">🤍</button>
                        </div>
                    </div>
                </div>

                 <div class="products" id="products">
                    <div class="products" data-name="?">
                        <div class="products-image">
                            <img src="img/" alt="?">
                            <span class="discount">-20%</span>
                            <button class="favorite-btn">🤍</button>
                        </div>
                    </div>
                </div>
            </section>
    </main>

    <footer>
        <!-- Rodapé da página -->
    </footer>

    <!-- Script JS para o carrossel -->
    <script src="js/carrossel.js"></script>
    <script src="js/tema.js"></script>

</body>

</html>
