<!DOCTYPE html>
<html lang="pt-BR">

<!-- Página de favoritos: mostra os produtos salvos e permite removê-los da lista. -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>favorios</title>
    <link rel="stylesheet" href="assets/css/pages/favorite.css">
    <link rel="stylesheet" href="assets/css/shared/navbar.css">
</head>

<body class="fav-body">

    <!--Cabeçalho-->
    <header>
       <!--o js coloca aumaticamente a navabr-->
    </header>

    <!-- Título e instruções da lista de favoritos. -->
    <nav class="fav-header">
        <div class="fav-header-content">
            <h1>Meus Favoritos</h1>
            <p>Gerencie e visualize rapidamente os itens que você marcou como "Gostei".</p>
        </div>
    </nav>


    <!-- A lista inicial é atualizada pelo JavaScript com os favoritos salvos. -->
    <main class="fav-main">
        <div class="fav-grid">

            <div class="fav-card">
                <div class="fav-image-placeholder">
                    <span>Produto 01</span>
                </div>
                <div class="fav-card-content">
                    <h3>ps5 pro</h3>
                    <p class="fav-price">R$ 5890,90</p>
                    <div class="fav-actions">
                        <button class="btn-primary">Ver Detalhes</button>
                        <button class="btn-remove" title="Remover dos favoritos">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="fav-card">
                <div class="fav-image-placeholder">
                    <span>Produto 02</span>
                </div>
                <div class="fav-card-content">
                    <h3>Mouse Gamer RGB Pro</h3>
                    <p class="fav-price">R$ 159,90</p>
                    <div class="fav-actions">
                        <button class="btn-primary">Ver Detalhes</button>
                        <button class="btn-remove" title="Remover dos favoritos">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="fav-card">
                <div class="fav-image-placeholder">
                    <span>Produto 03</span>
                </div>
                <div class="fav-card-content">
                    <h3>Teclado Mecânico Compacto</h3>
                    <p class="fav-price">R$ 449,00</p>
                    <div class="fav-actions">
                        <button class="btn-primary">Ver Detalhes</button>
                        <button class="btn-remove" title="Remover dos favoritos">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts para tema, recursos compartilhados do cabeçalho e lista de favoritos. -->
    <script src="assets/js/shared/tema.js"></script>
    <script src="assets/js/shared/navbar.js"></script>
    <script src="assets/js/pages/favorite.js"></script>

</body>

</html>
