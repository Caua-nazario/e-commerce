<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Seu E-commerce</title>
    <link rel="stylesheet" href="assets/css/pages/account.css">
    <link rel="stylesheet" href="assets/css/shared/navbar.css">
    <style>
        .login-card {
            position: relative;
            background: #111827;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        .login-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 17px;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y),
                    rgba(45, 212, 191, 0.4),
                    transparent 40%);
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.3s ease;
            opacity: 0.8;
        }

        .auth-tabs {
            position: relative;
            display: flex;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .tab-btn.active {
            color: #ffffff;
        }

        .tab-indicator {
            position: absolute;
            top: 4px;
            bottom: 4px;
            left: 4px;
            width: calc(50% - 4px);
            background: linear-gradient(135deg, #06b6d4, #0d9488);
            border-radius: 7px;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(6, 182, 212, 0.3);
        }

        .auth-tabs[data-active="1"] .tab-indicator {
            transform: translateX(100%);
        }

        .role-selector {
            display: none;
            margin-bottom: 16px;
        }

        .role-selector label.role-title {
            display: block;
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .role-options {
            display: flex;
            gap: 12px;
        }

        .role-option {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .role-option input {
            margin-right: 8px;
            accent-color: #06b6d4;
        }

        .role-option:hover {
            background: rgba(255, 255, 255, 0.07);
        }
    </style>
</head>

<body class="login-body">

    <header>
       
    </header>

    <main class="login-main">
        <div class="login-card">
            <h2>Acesse ou crie sua conta</h2>

            <div class="auth-tabs" role="tablist" aria-label="Acesso à conta" data-active="0">
                <button type="button" class="tab-btn active" role="tab" aria-selected="true">Login</button>
                <button type="button" class="tab-btn" role="tab" aria-selected="false">Criar Conta</button>
                <div class="tab-indicator"></div>
            </div>

            <form id="auth-form">

                <div class="input-group" id="name-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Nome completo" autocomplete="name" maxlength="80">
                </div>

                <div class="role-selector" id="role-group">
                    <label class="role-title">Tipo de Conta</label>
                    <div class="role-options">
                        <label class="role-option">
                            <input type="radio" name="userRole" value="client" checked> Sou Comprador
                        </label>
                        <label class="role-option">
                            <input type="radio" name="userRole" value="vendor"> Quero Vender
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="E-mail" autocomplete="email" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" minlength="1"
                        maxlength="128" required>
                </div>

                <div class="input-group" id="password-confirm-group">
                    <label for="confirmar-senha">Confirme sua senha</label>
                    <input type="password" id="confirmar-senha" placeholder="Digite a senha novamente"
                        autocomplete="new-password" maxlength="128" disabled>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">Entrar</button>

                <div class="divider"><span>Ou entre com</span></div>

                <button type="button" class="btn-google" id="btn-google">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4"
                            d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" />
                        <path fill="#34A853"
                            d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.36 7.23 24 12 24z" />
                        <path fill="#FBBC05"
                            d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 12s.43 3.88 1.19 5.42l4.09-3.15z" />
                        <path fill="#EA4335"
                            d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.64 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z" />
                    </svg>
                    Continuar com o Google
                </button>

                <div class="auth-footer">
                    <a href="#" id="forgot-link">Esqueceu sua senha?</a>
                </div>
                <p id="authMessage" class="auth-message" role="status" aria-live="polite">
                    As contas são salvas no servidor quando o banco de dados está configurado.
                </p>
            </form>
        </div>
    </main>

    <script src="assets/js/pages/account.js"></script>
    <script src="assets/js/shared/navbar.js"></script>
    <script src="assets/js/shared/tema.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const card = document.querySelector(".login-card");
            const tabsContainer = document.querySelector(".auth-tabs");
            const tabBtns = document.querySelectorAll(".tab-btn");
            const nameGroup = document.getElementById("name-group");
            const roleGroup = document.getElementById("role-group");
            const confirmPasswordGroup = document.getElementById("password-confirm-group");
            const confirmInput = document.getElementById("confirmar-senha");
            const submitBtn = document.getElementById("submit-btn");

            if (card) {
                card.addEventListener("mousemove", (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    card.style.setProperty("--mouse-x", `${x}px`);
                    card.style.setProperty("--mouse-y", `${y}px`);
                });
            }

            tabBtns.forEach((btn, index) => {
                btn.addEventListener("click", () => {
                    tabBtns.forEach(b => {
                        b.classList.remove("active");
                        b.setAttribute("aria-selected", "false");
                    });

                    btn.classList.add("active");
                    btn.setAttribute("aria-selected", "true");

                    tabsContainer.setAttribute("data-active", index);

                    if (index === 0) {
                        if (nameGroup) nameGroup.style.display = "none";
                        if (roleGroup) roleGroup.style.display = "none";
                        if (confirmPasswordGroup) confirmPasswordGroup.style.display = "none";
                        if (confirmInput) confirmInput.disabled = true;
                        if (submitBtn) submitBtn.textContent = "Entrar";
                    } else {
                        if (nameGroup) nameGroup.style.display = "block";
                        if (roleGroup) roleGroup.style.display = "block";
                        if (confirmPasswordGroup) confirmPasswordGroup.style.display = "block";
                        if (confirmInput) confirmInput.disabled = false;
                        if (submitBtn) submitBtn.textContent = "Criar Conta";
                    }
                });
            });
        });
    </script>
</body>

</html>
